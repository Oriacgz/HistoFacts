events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream auth_service {
        server auth-service:8001;
    }

    upstream history_service {
        server history-service:8002;
    }

    upstream social_service {
        server social-service:8003;
    }

    upstream groups_service {
        server groups-service:8004;
    }

    upstream notes_service {
        server notes-service:8005;
    }

    upstream quiz_service {
        server quiz-service:8006;
    }

    upstream notification_service {
        server notification-service:8007;
    }

    server {
        listen 80;
        server_name localhost;

        # CORS Headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # ── 1. Auth & Identity Service ──────────────────────────────
        location /api/auth/ {
            proxy_pass http://auth_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 2. History Content Service ──────────────────────────────
        location /api/events/ {
            proxy_pass http://history_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 3. Social Discussion Service ────────────────────────────
        location /api/social/ {
            proxy_pass http://social_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 4. Groups Service ───────────────────────────────────────
        location /api/groups/ {
            proxy_pass http://groups_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 5. AI Notes & Token Economy Service ─────────────────────
        location /api/notes/ {
            proxy_pass http://notes_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/wallet/ {
            proxy_pass http://notes_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/shop/ {
            proxy_pass http://notes_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 6. Quiz & Assessment Service (HTTP + WebSocket) ────────
        location /api/quiz/ {
            proxy_pass http://quiz_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── 7. Notification Service ────────────────────────────────
        location /api/notifications {
            proxy_pass http://notification_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Gateway Health Check
        location /health {
            default_type application/json;
            return 200 '{"status":"ok","gateway":"nginx","version":"1.0.0"}';
        }
    }
}
