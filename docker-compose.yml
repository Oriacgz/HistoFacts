version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: histofacts-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: histofacts
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: histofacts-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/histofacts
      SECRET_KEY: dev-secret-key-histofacts
      CORS_ORIGINS: "http://localhost,http://localhost:5173,http://localhost:80"
    depends_on:
      - db

  frontend:
    build: ./front-end
    container_name: histofacts-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
